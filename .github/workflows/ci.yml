name: CI

on:
  push:
    branches: [main]
  pull_request:
  # Deploy runs this as its quality gate before publishing an image.
  workflow_call:
    inputs:
      skip-image-build:
        description: The caller builds and pushes the image itself.
        type: boolean
        default: false

concurrency:
  # github.workflow is the CALLER's name when Deploy runs this, so the two runs
  # of one push land in different groups. With one shared group,
  # cancel-in-progress would make them cancel each other.
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: Lint, unit tests, build
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      NEXT_TELEMETRY_DISABLED: 1

    steps:
      - uses: actions/checkout@v5

      # Reads the version from package.json#packageManager.
      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: pnpm

      - run: pnpm install --frozen-lockfile
      - run: pnpm lint
      - run: pnpm test
      # `next build` type-checks the whole project, test files included, and
      # needs no env: the API address and JWT secret are read at runtime.
      - run: pnpm build

  # Every payload this app sends must match the API schema that validates it.
  # The API's zod objects strip unknown keys, so drift is silent data loss —
  # see scripts/check-api-contract.mjs. The API is its own repo, checked out
  # into its own job so it never lands inside this one's lint or build.
  contract:
    name: API contract
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5
      - uses: actions/checkout@v5
        with:
          repository: Arifur999/travelar_backend
          path: .api-src
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm check:contract
        env:
          API_REPO_DIR: .api-src

  docker:
    name: Production image builds
    # A negation on purpose: on push and pull_request `inputs` is empty, and
    # GitHub compares null == false as true, so `inputs.x != false` would skip it.
    if: ${{ !inputs.skip-image-build }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5
      - uses: docker/setup-buildx-action@v3
      - uses: docker/build-push-action@v6
        with:
          context: .
          push: false
          tags: travelar-web:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max
